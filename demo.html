<body>

<div class="container">

```
<h2>Cloudilya Student Details – CORS POST PoC</h2>

<label for="grpCode">GrpCode:</label><br>
<input
    type="text"
    id="grpCode"

>

>

<input
    type="number"
    id="studentId"
    value="10709"
>
<br>

<button onclick="sendRequest()">
    Send POST Request
</button>

<div id="status">
    Waiting...
</div>

    <strong>Request Body:</strong>

    <pre id="requestBody"></pre>
</div>

<div id="debug"></div>

            <th>Field</th>

        </tr>

</table>
```

</div>

<script>

const API_URL =
    "https://beesprod.beessoftware.cloud/CloudilyaAPITesting2/StudentSelfService/StudentSelfService_DisplayForStudentDetails/";


async function sendRequest() {

    const status =
        document.getElementById("status");

    const debug =
        document.getElementById("debug");

    const table =
        document.getElementById("studentTable");

    const tbody =
        document.getElementById("studentData");

    const requestBodyDisplay =
        document.getElementById("requestBody");


    /*
     * Build POST body
     */

    const requestBody = {

        GrpCode:
            document.getElementById("grpCode").value,

        ColCode:
            document.getElementById("colCode").value,

        StudentId:
            Number(
                document.getElementById("studentId").value
            ),

        StudentName:
            ""
    };


    /*
     * Display request body
     */

    requestBodyDisplay.textContent =
        JSON.stringify(
            requestBody,
            null,
            2
        );


    /*
     * Reset UI
     */

    status.textContent =
        "Sending POST request...";

    debug.textContent =
        "Request started...";

    table.style.display =
        "none";

    tbody.innerHTML =
        "";


    try {

        /*
         * Send POST request
         *
         * NOTE:
         * application/json can cause the browser
         * to perform a CORS OPTIONS preflight.
         */

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Accept":
                            "application/json, text/plain, */*",

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(requestBody)
                }
            );


        /*
         * Read response as text first
         */

        const responseText =
            await response.text();


        /*
         * Display basic response information
         */

        debug.textContent =
            "REQUEST INFORMATION\n" +
            "====================\n" +
            "Method: POST\n" +
            "URL: " + API_URL + "\n" +
            "Origin: " + window.location.origin + "\n\n" +

            "RESPONSE INFORMATION\n" +
            "====================\n" +
            "HTTP Status: " +
            response.status + "\n" +

            "Response Type: " +
            response.type + "\n" +

            "Response URL: " +
            response.url + "\n\n" +

            "Response Body:\n" +
            responseText;


        /*
         * Parse JSON response
         */

        let data;

        try {

            data =
                JSON.parse(responseText);

        } catch (jsonError) {

            status.textContent =
                "HTTP " +
                response.status +
                " — Response is not JSON.";

            return;
        }


        /*
         * Successful response
         */

        status.textContent =
            "POST Response Read Successfully — HTTP " +
            response.status;


        /*
         * Locate student object
         */

        const student =
            data.single ||
            (
                Array.isArray(data.list)
                    ? data.list[0]
                    : null
            );


        if (!student) {

            status.textContent =
                "Response received, but no student record was found.";

            return;
        }


        /*
         * Prepare displayed fields
         */

        const fields = {

            "Student Name":
                student.studentName,

            "Aadhaar Number":
                maskAadhaar(student.aadharNo),

            "Hall Ticket No":
                student.hallticketNo,

            "Program":
                student.programName,

            "Branch":
                student.branchName,

            "Semester":
                student.semesterName,

            "Section":
                student.sectionName,

            "Regulation":
                student.regulationName,

            "Batch":
                student.batch,

            "Gender":
                student.genderName,

            "Mobile":
                maskPhone(student.studMobile),

            "Father Name":
                student.fatherName,

            "Father Phone":
                maskPhone(student.fatherPhoneNo),

            "Date of Birth":
                student.dateOfBirth,

            "Admission No":
                student.admissionNo,

            "Admission Date":
                student.admissionDate,

            "Category":
                student.casteCategory,

            "Status":
                student.status
        };


        /*
         * Populate table
         */

        for (
            const [field, value]
            of Object.entries(fields)
        ) {

            const row =
                document.createElement("tr");


            const fieldCell =
                document.createElement("td");

            fieldCell.textContent =
                field;


            const valueCell =
                document.createElement("td");

            valueCell.textContent =
                value ?? "";


            row.appendChild(
                fieldCell
            );

            row.appendChild(
                valueCell
            );


            tbody.appendChild(
                row
            );
        }


        table.style.display =
            "table";


    } catch (error) {

        status.textContent =
            "CORS request failed: " +
            error.message;


        debug.textContent =
            "REQUEST FAILED\n" +
            "==============\n\n" +

            "Origin:\n" +
            window.location.origin +
            "\n\n" +

            "Target:\n" +
            API_URL +
            "\n\n" +

            "Browser Error:\n" +
            error.message +
            "\n\n" +

            "Check DevTools → Network → OPTIONS/POST.";
    }
}


/*
 * Aadhaar masking
 */

function maskAadhaar(value) {

    if (!value) {
        return "N/A";
    }

    value =
        String(value);


    if (value.length >= 4) {

        return (
            "XXXXXXXX" +
            value.slice(-4)
        );
    }


    return "REDACTED";
}


/*
 * Phone masking
 */

function maskPhone(value) {

    if (!value) {
        return "N/A";
    }

    value =
        String(value);


    if (value.length >= 4) {

        return (
            "XXXXXX" +
            value.slice(-4)
        );
    }


    return "REDACTED";
}

</script>
