</head>

<body>

<h2>Cloudilya Student Details – CORS PoC</h2>

<label>GrpCode:</label><br> <input type="text" id="grpCode" value="gcettest"><br>

<label>ColCode:</label><br> <input type="text" id="colCode" value="0001"><br>

<label>Student ID:</label><br> <input type="number" id="studentId" value="10709"><br>

<button onclick="sendRequest()">Send POST Request</button>

<div id="status">Waiting...</div>

<table id="studentTable" style="display:none;">
    <thead>
        <tr>
            <th>Field</th>
            <th>Value</th>
        </tr>
    </thead>
    <tbody id="studentData"></tbody>
</table>

<script>
async function sendRequest() {

    const status = document.getElementById("status");
    const table = document.getElementById("studentTable");
    const tbody = document.getElementById("studentData");

    const requestBody = {
        GrpCode: document.getElementById("grpCode").value,
        ColCode: document.getElementById("colCode").value,
        StudentId: Number(document.getElementById("studentId").value),
        StudentName: ""
    };

    status.textContent = "Sending POST request...";
    table.style.display = "none";
    tbody.innerHTML = "";

    try {

        const response = await fetch(
            "https://beesprod.beessoftware.cloud/CloudilyaAPITesting2/StudentSelfService/StudentSelfService_DisplayForStudentDetails/",
            {
                method: "POST",
                credentials: "omit",

                headers: {
                    "Accept": "application/json, text/plain, */*",
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(requestBody)
            }
        );

        const text = await response.text();

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            status.textContent =
                "HTTP " + response.status + " — Response was not JSON.";
            console.log(text);
            return;
        }

        status.textContent =
            "CORS Response Read Successfully — HTTP " + response.status;

        const student = data.single || data.list?.[0];

        if (!student) {
            status.textContent = "No student record returned.";
            console.log(data);
            return;
        }

        const fields = {
            "Student Name": student.studentName,
            "Aadhaar Number": maskAadhaar(student.aadharNo),
            "Hall Ticket No": student.hallticketNo,
            "Program": student.programName,
            "Branch": student.branchName,
            "Semester": student.semesterName,
            "Section": student.sectionName,
            "Regulation": student.regulationName,
            "Batch": student.batch,
            "Gender": student.genderName,
            "Mobile": maskPhone(student.studMobile),
            "Father Name": student.fatherName,
            "Father Phone": maskPhone(student.fatherPhoneNo),
            "Date of Birth": student.dateOfBirth,
            "Admission No": student.admissionNo,
            "Admission Date": student.admissionDate,
            "Category": student.casteCategory,
            "Status": student.status
        };

        for (const [field, value] of Object.entries(fields)) {

            const row = document.createElement("tr");

            const fieldCell = document.createElement("td");
            fieldCell.textContent = field;

            const valueCell = document.createElement("td");
            valueCell.textContent = value ?? "";

            row.appendChild(fieldCell);
            row.appendChild(valueCell);

            tbody.appendChild(row);
        }

        table.style.display = "table";

    } catch (error) {

        status.textContent =
            "CORS request failed: " + error.message;

        console.error(error);
    }
}

function maskAadhaar(value) {

    if (!value) return "N/A";

    value = String(value);

    if (value.length >= 4) {
        return "XXXXXXXX" + value.slice(-4);
    }

    return "REDACTED";
}

function maskPhone(value) {

    if (!value) return "N/A";

    value = String(value);

    if (value.length >= 4) {
        return "XXXXXX" + value.slice(-4);
    }

    return "REDACTED";
}
</script>

</body>
